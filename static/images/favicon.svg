<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0D1117"/>

  <!-- Palm of hand -->
  <rect x="20" y="26" width="22" height="20" rx="5" fill="#007A5E"/>

  <!-- Thumb -->
  <rect x="13" y="30" width="10" height="8" rx="4" fill="#007A5E"/>

  <!-- Fingers (4) -->
  <!-- Index -->
  <rect x="20" y="14" width="5" height="15" rx="2.5" fill="#007A5E"/>
  <!-- Middle -->
  <rect x="27" y="12" width="5" height="17" rx="2.5" fill="#007A5E"/>
  <!-- Ring -->
  <rect x="34" y="14" width="5" height="15" rx="2.5" fill="#007A5E"/>
  <!-- Pinky — folded (shorter) -->
  <rect x="37" y="22" width="4" height="8" rx="2" fill="#009970"/>

  <!-- Bridge arc under the hand -->
  <path d="M 16 50 Q 32 40 48 50" stroke="#FCD116" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Bridge pillars -->
  <line x1="22" y1="50" x2="22" y2="56" stroke="#FCD116" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="50" x2="42" y2="56" stroke="#FCD116" stroke-width="2.5" stroke-linecap="round"/>
</svg>
