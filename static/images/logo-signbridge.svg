<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none">
  <!-- ── ICÔNE (main + pont) ─────────────────────── -->
  <g transform="translate(2, 4)">
    <!-- Palm -->
    <rect x="8"  y="16" width="18" height="17" rx="4" fill="#007A5E"/>
    <!-- Thumb -->
    <rect x="2"  y="20" width="9"  height="7"  rx="3.5" fill="#007A5E"/>
    <!-- Index finger -->
    <rect x="8"  y="4"  width="4"  height="14" rx="2" fill="#007A5E"/>
    <!-- Middle finger -->
    <rect x="14" y="2"  width="4"  height="16" rx="2" fill="#007A5E"/>
    <!-- Ring finger -->
    <rect x="20" y="4"  width="4"  height="14" rx="2" fill="#007A5E"/>
    <!-- Pinky (folded) -->
    <rect x="23" y="12" width="3"  height="7"  rx="1.5" fill="#009970"/>

    <!-- Bridge arc -->
    <path d="M 4 40 Q 18 32 32 40" stroke="#FCD116" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Bridge pillars -->
    <line x1="9"  y1="40" x2="9"  y2="45" stroke="#FCD116" stroke-width="2" stroke-linecap="round"/>
    <line x1="27" y1="40" x2="27" y2="45" stroke="#FCD116" stroke-width="2" stroke-linecap="round"/>
    <!-- Bridge deck line -->
    <line x1="4"  y1="45" x2="32" y2="45" stroke="#FCD116" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/>
  </g>

  <!-- ── TEXTE ─────────────────────────────────────────── -->
  <!-- "Sign" en blanc -->
  <text x="44" y="34"
    font-family="Poppins, sans-serif"
    font-weight="700"
    font-size="26"
    letter-spacing="-0.5"
    fill="#F0F6FC">Sign</text>

  <!-- "Bridge" en jaune -->
  <text x="100" y="34"
    font-family="Poppins, sans-serif"
    font-weight="700"
    font-size="26"
    letter-spacing="-0.5"
    fill="#FCD116">Bridge</text>

  <!-- Tagline -->
  <text x="44" y="48"
    font-family="Inter, sans-serif"
    font-weight="400"
    font-size="9"
    letter-spacing="0.8"
    fill="#8B949E">LANGUE DES SIGNES FRANÇAISE</text>
</svg>
